<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>For You ❤️</title>

  <!-- Google Fonts: Elegant Serif & Warm Handwritten Script -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Particle / Star Canvas -->
  <canvas id="starCanvas"></canvas>

  <!-- Background Ambient Glow -->
  <div class="ambient-glow" id="ambientGlow"></div>

  <!-- App Viewport Container (Mobile-First 390px base) -->
  <main class="experience-container" id="app">

    <!-- ================= STAGE 1: MAGICAL FLOWER BLOOM ================= -->
    <section class="stage active" id="stage1">
      <div class="flower-wrap" id="flowerWrap">
        <svg class="rose-svg" viewBox="0 0 200 240" aria-label="A blooming rose">
          <defs>
            <radialGradient id="petalGlow" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#f8a5b8" />
              <stop offset="60%" stop-color="#c93b58" />
              <stop offset="100%" stop-color="#540e1f" />
            </radialGradient>
            <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4a6b47" />
              <stop offset="100%" stop-color="#1f361d" />
            </linearGradient>
          </defs>
          
          <!-- Stem and Leaves -->
          <path class="rose-stem" d="M 100,120 Q 95,170 100,230" fill="none" stroke="url(#stemGrad)" stroke-width="4" stroke-linecap="round"/>
          <path class="rose-leaf leaf-left" d="M 98,170 Q 70,165 65,145 Q 85,150 98,170" fill="#3a5a37"/>
          <path class="rose-leaf leaf-right" d="M 99,190 Q 125,185 130,165 Q 110,170 99,190" fill="#3a5a37"/>

          <!-- Layered Petals (Outer to Inner) -->
          <g class="rose-petals">
            <path class="petal petal-outer-1" d="M 100,120 C 50,110 50,55 100,45 C 150,55 150,110 100,120 Z" fill="url(#petalGlow)"/>
            <path class="petal petal-outer-2" d="M 85,115 C 45,90 55,45 95,50 C 125,50 140,85 85,115 Z" fill="url(#petalGlow)"/>
            <path class="petal petal-outer-3" d="M 115,115 C 155,90 145,45 105,50 C 75,50 60,85 115,115 Z" fill="url(#petalGlow)"/>
            <path class="petal petal-mid-1" d="M 100,105 C 70,95 70,60 100,60 C 130,60 130,95 100,105 Z" fill="#dd4a6a"/>
            <path class="petal petal-mid-2" d="M 92,100 C 75,85 80,65 100,65 C 120,65 125,85 92,100 Z" fill="#e8617f"/>
            <circle class="petal petal-core" cx="100" cy="78" r="10" fill="#f38ba0"/>
          </g>
        </svg>
      </div>

      <div class="stage-text-wrap">
        <h1 class="script-title fade-in-delayed" id="introTitle"></h1>
      </div>
    </section>

    <!-- ================= STAGE 2: THE ENVELOPE ================= -->
    <section class="stage" id="stage2">
      <div class="envelope-container" id="envelopeWrapper" role="button" tabindex="0" aria-label="Open letter">
        <div class="envelope" id="envelope">
          <div class="envelope-back"></div>
          <div class="letter-preview" id="letterPreview">
            <div class="letter-preview-lines">
              <span></span><span></span><span></span>
            </div>
          </div>
          <div class="envelope-front-left"></div>
          <div class="envelope-front-right"></div>
          <div class="envelope-bottom"></div>
          <div class="envelope-flap" id="envelopeFlap">
            <div class="wax-seal">❤️</div>
          </div>
        </div>
      </div>
      <p class="instruction-text" id="envelopePrompt">Open it ❤️</p>
    </section>

    <!-- ================= STAGE 3: THE LETTER ================= -->
    <section class="stage" id="stage3">
      <article class="parchment-card" id="parchmentCard">
        <div class="card-inner">
          <div class="card-header-ornament">✦ ✦ ✦</div>
          <div class="letter-content font-script" id="letterText">
            <!-- Injected smoothly via script.js -->
          </div>
          <div class="card-footer">
            <button class="romantic-btn" id="toWishBtn" type="button"></button>
          </div>
        </div>
      </article>
    </section>

    <!-- ================= STAGE 4: THE BIRTHDAY WISH ================= -->
    <section class="stage" id="stage4">
      <div class="wish-card">
        <div class="wish-content font-serif" id="wishPromptText">
          <!-- Injected via script.js -->
        </div>
        <div class="wish-action">
          <button class="romantic-btn glow-btn" id="wishDoneBtn" type="button"></button>
        </div>
      </div>
    </section>

    <!-- ================= STAGE 5: FINAL MESSAGE & EASTER EGG ================= -->
    <section class="stage" id="stage5">
      <div class="final-card">
        <!-- Interactive Heart with Easter Egg -->
        <div class="sacred-heart-wrap" id="sacredHeart" role="button" tabindex="0" aria-label="A glowing heart">
          <div class="sacred-heart">❤️</div>
          <div class="heart-pulse"></div>
        </div>

        <div class="final-content font-serif" id="finalMessageText">
          <!-- Injected via script.js -->
        </div>

        <!-- Easter Egg Toast Notification -->
        <div class="easter-egg-toast" id="easterEggToast" aria-live="polite"></div>
      </div>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
